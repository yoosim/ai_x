{% load static %}
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교통사고 협의서 - 입력</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --card:#fff; --line:#e9e9e9; --text:#333;
    --chip-text: rgba(51,51,51,.78);
  }

  /* Base */
  body{font-family:'Malgun Gothic','맑은 고딕',system-ui; background:#f7f8fa; margin:0;}
  .wrap{max-width:1100px;margin:24px auto;padding:16px;}
  form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.04)}
  h2{margin:28px 0 10px;border-bottom:2px solid #f0f0f0;padding-bottom:6px}
  h3{margin:12px 0 8px}
  fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
  legend{padding:0 8px;font-weight:700}
  label{display:block;margin:6px 0}
  input,select,textarea{width:100%;padding:8px;border:1px solid #cfcfcf;border-radius:8px}
  textarea{resize:vertical}

  /* Grid helpers */
  .grid{display:grid;gap:20px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  fieldset label{ margin:8px 0 }
  @media (max-width:900px){ .g2,.g3,.g4{grid-template-columns:1fr} }

  /* Section cards & 2‑column layout */
  .section-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;margin:12px 0}
  .section-split{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
  .info-col{display:block}
  .side-col{display:flex;flex-direction:column;gap:12px}
  @media (max-width:900px){
    .section-split{grid-template-columns:1fr}
    /* 모바일 순서: 미리보기 → 손상부위 */
    .side-col .preview-wrap{order:1}
    .side-col .parts-wrap{order:2}
  }

  /* Parts selector */
  .parts-grid{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr))}
  .part-item{background:#fff;border:1px solid #eee;border-radius:10px;padding:8px 10px;font-size:14px}
  @media (max-width:900px){ .parts-grid{grid-template-columns:repeat(2,1fr)} }

  /* Chips (선택 순서, 파스텔 그라데이션) */
  .chips{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);gap:8px 8px;margin:8px 0 12px}
  .chip{padding:6px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.05);
        color:var(--chip-text);font-weight:700;white-space:nowrap;opacity:.9}
  .chip:hover{opacity:1}

  /* Preview image & mark */
  .imgcard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px}
  .imgcard .title{font-weight:700;margin-bottom:6px}
  .imgbox{position:relative;width:100%;max-width:520px;margin:auto}
  .imgbox img{width:100%;height:auto;display:block;border-radius:10px}
  .mark{
    position:absolute;transform:translate(-50%,-50%);
    width:10px;height:10px;border-radius:50%;
    z-index:20;                   /* 이미지보다 위 */
    background:#f99;              /* JS에서 다시 색 입힘 */
    box-shadow:0 0 0 2px rgba(0,0,0,.25); /* 테두리 가시성 ↑ */
    border:1px solid rgba(255,255,255,.7); /* 흰색 외곽선 */
    opacity:1;                  /* 너무 연하지 않게 */
  }

  /* Weather row: 한 줄 가로/가운데 */
  .weather-row{display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 0}
  .weather-row label{display:inline-flex !important;align-items:center;gap:6px;margin:0}
  .weather-row input[type="checkbox"]{margin:0;vertical-align:middle}

  /* Buttons */
  .btns{display:flex;gap:10px;margin-top:16px}
  .btn{padding:10px 16px;border:none;border-radius:10px;background:#111;color:#fff;font-weight:700;cursor:pointer}
  .btn.light{background:#f2f2f2;color:#111;border:1px solid #ddd}

  /* Toast */
  .toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999}
  .toast{background:#111;color:#fff;border-radius:10px;padding:10px 14px;margin-top:8px;opacity:.96}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:10000}
  .modal-body{width:min(1100px,95vw);height:min(90vh,800px);background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .modal-head{padding:8px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
  .modal-body iframe{flex:1;border:0}
</style>

</head>

<!-- 1) 서버에서 내려오는 JSON (반드시 body 안, script보다 위) -->
{{ part_anchors|json_script:"part-anchors" }}
{{ label_colors|json_script:"label-colors" }}

<!-- 미리보기 모달 -->
<div class="modal" id="modal">
  <div class="modal-body">
    <div class="modal-head">
      <strong>미리보기</strong>
      <button class="btn light" id="modal-close">닫기</button>
    </div>
    <iframe id="preview-frame" src="about:blank"></iframe>
  </div>
</div>

<script>
// 서버에서 내려준 상수 (constants.py → views.py → 템플릿)
const PART_ANCHORS = JSON.parse(document.getElementById('part-anchors').textContent);      // dict[str, [c1,c2]]
const LABEL_COLORS = JSON.parse(document.getElementById('label-colors').textContent);   // dict[str, {x,y}]
const PARTS = Object.keys(PART_ANCHORS);
console.log('anchors loaded', PART_ANCHORS);
console.log('colors loaded', LABEL_COLORS);
// if(!window.PART_ANCHORS){ console.error('PART_ANCHORS missing'); }
// if(!window.LABEL_COLORS){ console.error('LABEL_COLORS missing'); }

// ===== A/B 손상부위 체크 UI 생성 =====
function buildParts(containerId, chipsId, hiddenId, imgBoxId){
  const cont   = document.getElementById(containerId);  if(!cont) return;
  const chips  = document.getElementById(chipsId);      if(!chips) return;
  const hidden = document.getElementById(hiddenId);     if(!hidden) return;
  const imgBox = document.getElementById(imgBoxId);     if(!imgBox) return;
  const sel = []; // 선택 순서

  // 1) 체크박스 생성
  PARTS.forEach(label=>{
    const wrap = document.createElement('label');
    wrap.className = 'part-item';
    wrap.innerHTML = `<input type="checkbox" value="${label}"> ${label}`;
    cont.appendChild(wrap);
    const cb = wrap.querySelector('input');

    cb.addEventListener('change', ()=>{
      if(cb.checked){ if(!sel.includes(label)) sel.push(label); }
      else{ const i = sel.indexOf(label); if(i>-1) sel.splice(i,1); }
      hidden.value = JSON.stringify(sel);
      renderChips(); 
      renderMarks();
    });
  });

  // 2) 칩 렌더링(선택 순서대로, 파스텔 그라데이션)
  function renderChips(){
    chips.innerHTML = '';
    sel.forEach(label=>{
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      const [c1,c2] = (LABEL_COLORS[label] || ["#eaeefc","#f7f9ff"]);
      chip.style.background = `linear-gradient(90deg, ${c1}, ${c2})`;
      chip.textContent = label;
      chip.onclick = ()=>{
        const cb = cont.querySelector(`input[value="${label}"]`);
        if(cb){ cb.checked = false; cb.dispatchEvent(new Event('change')); }
        // 칩 조작 시 미리보기 위치로 스크롤
        const card = imgBox.closest('.imgcard');
        if(card){ card.scrollIntoView({behavior:'smooth', block:'center'}); }
      };
      chips.appendChild(chip);
    });
  }

  // 3) 마크 렌더링(라벨 좌표에 파스텔 점)
  function renderMarks(){
    imgBox.querySelectorAll('.mark').forEach(m=>m.remove());

    sel.forEach(lb=>{
      const pt = PART_ANCHORS[lb];
      if(!pt){ console.warn('no anchor for', lb); return; }

      const dot = document.createElement('div');
      dot.className = 'mark';
      dot.style.left = pt.x + '%';
      dot.style.top  = pt.y + '%';

      const [c1] = (LABEL_COLORS[lb] || ['#ff3b30']);
      dot.style.background = c1;
      dot.style.width = '12px';   // ← 테스트로 크게
      dot.style.height = '12px';  // ← 테스트로 크게
      dot.style.zIndex = '10';
      imgBox.appendChild(dot);
    });
  }


  // 4) 초기값 복원(수정 화면에서 hidden에 값이 이미 있는 경우)
  try{
    const initial = JSON.parse(hidden.value || '[]');
    if(Array.isArray(initial) && initial.length){
      initial.forEach(label=>{
        const cb = cont.querySelector(`input[value="${label}"]`);
        if(cb){ cb.checked = true; if(!sel.includes(label)) sel.push(label); }
      });
      hidden.value = JSON.stringify(sel);
      renderChips(); renderMarks();
    }
  }catch(_){ /* 무시 */ }

  // 초깃값 저장
  hidden.value = JSON.stringify(sel);
  return { getSelected: ()=> sel };
}

function bindPassenger(prefix){

  if(!male || !female || !total) return;
  const update = ()=>{ const m=+male.value||0, f=+female.value||0; total.value = (m+f); };

  female.addEventListener('input',update);
  update();
}

// ===== 토스트 =====
function toast(msg){
  const host = document.querySelector('.toast-container') || (()=>{
    const d=document.createElement('div'); d.className='toast-container'; document.body.appendChild(d); return d;
  })();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; host.appendChild(t);
  setTimeout(()=>t.remove(), 1800);
}

// ===== 날짜 모달 =====
const dlg  = document.getElementById('dateDialog');
const disp = document.getElementById('accident_date_display');
const pick = document.getElementById('accident_date_picker');
const val  = document.getElementById('accident_date_value');

// YYYY-MM-DD HH:mm
function fmt(dt){
  const z=n=>String(n).padStart(2,'0');
  return `${dt.getFullYear()}-${z(dt.getMonth()+1)}-${z(dt.getDate())} ${z(dt.getHours())}:${z(dt.getMinutes())}`;
}

if(disp && dlg && pick && val){
  // 표시용 클릭 → 모달 열기(기존값 반영)
  disp.addEventListener('click', ()=>{
    if(val.value){
      const iso = val.value.includes('T') ? val.value : val.value.replace(' ', 'T');
      pick.value = iso;
    }
    dlg.showModal();
  });

  // 완료/취소
  const btnCancel = document.getElementById('dateCancel');
  const btnOk     = document.getElementById('dateOk');
  if(btnCancel){ btnCancel.onclick = ()=> dlg.close(); }
  if(btnOk){
    btnOk.onclick = ()=>{
      if(!pick.value){ alert('날짜/시간을 선택하세요.'); return; }
      val.value  = pick.value;                 // 서버 전송값
      disp.value = fmt(new Date(pick.value));  // 사용자 표시값
      dlg.close();
    };
  }

  // 외부 클릭 닫기
  dlg.addEventListener('click', (e)=>{
    const rect = dlg.getBoundingClientRect();
    const inside = (e.clientX>=rect.left && e.clientX<=rect.right && e.clientY>=rect.top && e.clientY<=rect.bottom);
    if(!inside) dlg.close();
  });

  // 최초 로드 시 기존값 표시
  (function hydrate(){
    if(!val || !val.value) return;
    const iso = val.value.includes('T') ? val.value : val.value.replace(' ', 'T');
    const d = new Date(iso);
    if(!isNaN(d)) disp.value = fmt(d);
  })();
}

async function upsertRecordThen(runNext){
  // 폼 스냅샷 가져오기(너의 현재 구조에 맞게 조정)
  let F = {};
  try { F = JSON.parse(localStorage.getItem('print_payload') || '{}'); } catch(e){ F = {}; }

  // 최소 필드 보정 (없을 때 대비)
  const payload = F;
  const data = {
    accident_date: F.accident_date || F.accident_date_display || new Date().toISOString(),
    location: F.location || '',
    a_plate: F.a_plate || '',
    b_plate: F.b_plate || '',
    payload: payload   // 주민번호는 마스킹된 값으로 들어가도록 유지
  };

  const resp = await fetch("{% url 'record_upsert_api' %}", {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-CSRFToken": getCsrf()},
    body: JSON.stringify(data)
  }).then(r=>r.json()).catch(()=>({ok:false}));

  if (!resp || !resp.ok) {
    console.warn("기록 저장 실패(다운로드는 계속 진행):", resp);
  }
  runNext && runNext(resp?.id);
}

function getCsrf(){
  const el = document.querySelector('input[name=csrfmiddlewaretoken]');
  return el ? el.value : (document.cookie.match(/csrftoken=([^;]+)/)?.[1] || "");
}
